<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 手势交互粒子系统</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        
        /* 视频隐藏，只用于分析 */
        #input_video { position: absolute; top: 0; left: 0; opacity: 0; pointer-events: none; z-index: -1; }
        
        /* 加载提示 */
        #loader {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 24px; pointer-events: none; text-align: center;
        }

        /* 全屏按钮 */
        #fs-btn {
            position: absolute; bottom: 20px; right: 20px;
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3);
            color: white; padding: 10px 20px; cursor: pointer; border-radius: 8px;
            backdrop-filter: blur(5px); transition: 0.3s; z-index: 100;
        }
        #fs-btn:hover { background: rgba(255, 255, 255, 0.3); }

        /* 手势状态指示 */
        #status {
            position: absolute; top: 20px; left: 20px;
            color: #00ffcc; font-size: 14px; background: rgba(0,0,0,0.5);
            padding: 8px 15px; border-radius: 20px; border: 1px solid #00ffcc;
            opacity: 0; transition: opacity 0.5s;
        }
    </style>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/jsm/libs/lil-gui.module.min.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>
<body>

    <div id="loader">正在初始化摄像头与AI模型...<br><span style="font-size:14px; opacity:0.7">请允许摄像头权限</span></div>
    <div id="status">手势已连接</div>
    <video id="input_video" width="640" height="480" autoplay playsinline></video>
    <button id="fs-btn">⛶ 全屏模式</button>

    <script type="module">
        import { GUI } from 'https://unpkg.com/three@0.160.0/examples/jsm/libs/lil-gui.module.min.js';

        // --- 全局变量 ---
        let scene, camera, renderer, particles, geometry;
        let targetPositions = []; // 目标形状的坐标数组
        const particleCount = 15000; // 粒子数量
        const positions = new Float32Array(particleCount * 3);
        
        // 交互状态
        const state = {
            shape: 'heart',
            color: '#ff0055',
            particleSize: 0.08,
            handOpenness: 0, // 0 = 捏合/闭合, 1 = 张开
            smoothing: 0.1,  // 动画平滑度
        };

        // --- 1. Three.js 初始化 ---
        function initThree() {
            scene = new THREE.Scene();
            // 添加一点雾化效果增加深度
            scene.fog = new THREE.FogExp2(0x000000, 0.02);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 20;
            camera.position.y = 2;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // 创建粒子几何体
            geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            // 材质
            const material = new THREE.PointsMaterial({
                color: state.color,
                size: state.particleSize,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            // 初始生成爱心
            generateShape('heart');
            
            // 窗口大小调整
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // 全屏逻辑
            document.getElementById('fs-btn').addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            });
        }

        // --- 2. 形状生成算法 (数学参数方程) ---
        function generateShape(type) {
            targetPositions = [];
            const scale = 5; // 基础缩放

            for (let i = 0; i < particleCount; i++) {
                let x, y, z;
                
                if (type === 'heart') {
                    // 3D 爱心方程
                    const phi = Math.random() * Math.PI * 2;
                    const theta = Math.random() * Math.PI;
                    // 使用稍微复杂的公式让心形更饱满
                    const t = Math.random() * Math.PI * 2;
                    // 这是一个经典的2D心形拉伸或者3D参数方程
                    // 这里使用拒绝采样在立方体中雕刻，或者简单的参数方程
                    // 简单参数方程：
                    x = 16 * Math.pow(Math.sin(t), 3);
                    y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                    z = (Math.random() - 0.5) * 10; // 简单的厚度
                    // 增加随机性填充内部
                    const r = Math.random();
                    x *= r * 0.3; y *= r * 0.3; z *= r * 0.3;
                    
                } else if (type === 'flower') {
                    // 玫瑰线/花朵参数
                    const u = Math.random() * Math.PI * 4; // 角度
                    const v = Math.random() * Math.PI;
                    const r = 3 * Math.cos(3 * u); // 3瓣花
                    x = r * Math.sin(v) * Math.cos(u) * scale;
                    y = r * Math.sin(v) * Math.sin(u) * scale;
                    z = r * Math.cos(v) * scale;

                } else if (type === 'star') {
                    // 土星/星球 (球体 + 环)
                    const isRing = Math.random() > 0.6;
                    if (isRing) {
                        const theta = Math.random() * Math.PI * 2;
                        const r = 6 + Math.random() * 2; // 环半径
                        x = r * Math.cos(theta);
                        z = r * Math.sin(theta);
                        y = (Math.random() - 0.5) * 0.5; // 薄环
                    } else {
                        // 球体
                        const theta = Math.random() * Math.PI * 2;
                        const phi = Math.acos(2 * Math.random() - 1);
                        const r = 3.5;
                        x = r * Math.sin(phi) * Math.cos(theta);
                        y = r * Math.sin(phi) * Math.sin(theta);
                        z = r * Math.cos(phi);
                    }

                } else if (type === 'buddha') {
                    // 程序化生成抽象打坐人像 (堆叠球体模拟)
                    const r = Math.random();
                    if (r < 0.3) {
                        // 头
                        const theta = Math.random() * Math.PI * 2;
                        const phi = Math.acos(2 * Math.random() - 1);
                        x = 1.5 * Math.sin(phi) * Math.cos(theta);
                        y = 1.5 * Math.sin(phi) * Math.sin(theta) + 3.5;
                        z = 1.5 * Math.cos(phi);
                    } else if (r < 0.7) {
                        // 身体
                        const theta = Math.random() * Math.PI * 2;
                        const phi = Math.acos(2 * Math.random() - 1);
                        x = 2.5 * Math.sin(phi) * Math.cos(theta);
                        y = 2.5 * Math.sin(phi) * Math.sin(theta);
                        z = 2.5 * Math.cos(phi);
                    } else {
                        // 盘腿底座 (扁球)
                        const theta = Math.random() * Math.PI * 2;
                        const rad = 4 * Math.sqrt(Math.random());
                        x = rad * Math.cos(theta);
                        z = rad * Math.sin(theta);
                        y = (Math.random() - 0.5) * 2 - 2; 
                    }

                } else if (type === 'fireworks') {
                    // 烟花 (随机球体爆炸态)
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    const r = Math.random() * 10; // 扩散很大
                    x = r * Math.sin(phi) * Math.cos(theta);
                    y = r * Math.sin(phi) * Math.sin(theta);
                    z = r * Math.cos(phi);
                }

                targetPositions.push(x, y, z);
            }
        }

        // --- 3. UI 面板 ---
        function initGUI() {
            const gui = new GUI({ title: '控制面板' });
            
            // 模型选择
            gui.add(state, 'shape', {
                '❤️ 爱心': 'heart',
                '🌸 花朵': 'flower',
                '🪐 星球': 'star',
                '🧘 禅意': 'buddha',
                '🎆 烟花': 'fireworks'
            }).name('模型选择').onChange((val) => {
                generateShape(val);
            });

            // 颜色选择
            gui.addColor(state, 'color').name('粒子颜色').onChange((val) => {
                particles.material.color.set(val);
            });

            // 粒子大小
            gui.add(state, 'particleSize', 0.01, 0.5).name('粒子大小').onChange((val) => {
                particles.material.size = val;
            });

            gui.add(state, 'smoothing', 0.01, 0.5).name('响应速度');
        }

        // --- 4. 动画循环与逻辑 ---
        function animate() {
            requestAnimationFrame(animate);

            const positionsArray = particles.geometry.attributes.position.array;
            const time = Date.now() * 0.001;

            // 根据手势计算扩散因子
            // 如果手张开(handOpenness接近1)，粒子扩散/放大；如果捏合(0)，粒子回到原位
            const explodeFactor = state.handOpenness * 8.0; 
            const noiseScale = state.handOpenness * 0.5;

            for (let i = 0; i < particleCount; i++) {
                const ix = i * 3;
                const iy = i * 3 + 1;
                const iz = i * 3 + 2;

                let tx = targetPositions[ix];
                let ty = targetPositions[iy];
                let tz = targetPositions[iz];

                // 手势扩散逻辑: 沿着原点向外推
                if (explodeFactor > 0.1) {
                    tx += tx * explodeFactor * 0.5;
                    ty += ty * explodeFactor * 0.5;
                    tz += tz * explodeFactor * 0.5;
                    
                    // 添加震动/噪点效果，模拟不稳定能量
                    tx += (Math.random() - 0.5) * noiseScale;
                    ty += (Math.random() - 0.5) * noiseScale;
                    tz += (Math.random() - 0.5) * noiseScale;
                }

                // 旋转整个粒子群 (自转)
                const cosT = Math.cos(0.002);
                const sinT = Math.sin(0.002);
                // 简单的Y轴旋转
                // 这里省略复杂的矩阵运算，直接让粒子位置慢慢插值过去
                
                // 线性插值 (Lerp) 实现平滑过渡
                positionsArray[ix] += (tx - positionsArray[ix]) * state.smoothing;
                positionsArray[iy] += (ty - positionsArray[iy]) * state.smoothing;
                positionsArray[iz] += (tz - positionsArray[iz]) * state.smoothing;
            }

            // 整体轻微旋转
            particles.rotation.y += 0.002;
            particles.rotation.z += 0.001 * (1 + state.handOpenness * 5); // 手张开转得快

            particles.geometry.attributes.position.needsUpdate = true;
            renderer.render(scene, camera);
        }

        // --- 5. MediaPipe 手势识别 ---
        function initMediaPipe() {
            const videoElement = document.getElementById('input_video');
            
            const hands = new Hands({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }});

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onResults);

            const cameraUtils = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({image: videoElement});
                },
                width: 640,
                height: 480
            });
            
            cameraUtils.start()
                .then(() => {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('status').style.opacity = '1';
                })
                .catch(err => {
                    console.error("摄像头启动失败:", err);
                    document.getElementById('loader').innerHTML = "无法访问摄像头<br>请检查权限或HTTPS设置";
                });
        }

        function onResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // 关键点：4 (拇指指尖) 和 8 (食指指尖)
                const thumbTip = landmarks[4];
                const indexTip = landmarks[8];
                const wrist = landmarks[0];

                // 计算 拇指 和 食指 的距离
                const distance = Math.sqrt(
                    Math.pow(thumbTip.x - indexTip.x, 2) +
                    Math.pow(thumbTip.y - indexTip.y, 2) +
                    Math.pow(thumbTip.z - indexTip.z, 2)
                );

                // 归一化距离 (大约在 0.02 到 0.2 之间变化)
                // 我们设定一个范围来映射到 0~1
                // < 0.05 认为是捏合 (0), > 0.15 认为是张开 (1)
                let openness = (distance - 0.03) / (0.15 - 0.03);
                openness = Math.max(0, Math.min(1, openness));

                state.handOpenness = openness;
                document.getElementById('status').innerText = `手势控制中: ${(openness * 100).toFixed(0)}%`;
            } else {
                // 没有检测到手时，缓慢恢复默认
                state.handOpenness = state.handOpenness * 0.9;
                document.getElementById('status').innerText = `等待手势...`;
            }
        }

        // --- 启动程序 ---
        initThree();
        initGUI();
        animate();
        // 延迟一点加载摄像头，避免阻塞渲染初始化
        setTimeout(initMediaPipe, 1000);

    </script>
</body>
</html>
