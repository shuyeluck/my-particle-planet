<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 双爱心手势与粒子系统</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(0, 255, 204, 0.08), transparent 30%),
                radial-gradient(circle at bottom right, rgba(255, 0, 102, 0.12), transparent 25%),
                linear-gradient(180deg, #03040a 0%, #000 100%);
            font-family: 'Segoe UI', sans-serif;
        }
        canvas { display: block; }
        
        /* 右下角真人预览小窗 */
        #camera-preview {
            position: absolute;
            right: 20px;
            bottom: 20px;
            width: 260px;
            height: 180px;
            padding: 10px;
            border-radius: 22px;
            background: linear-gradient(180deg, rgba(5, 12, 22, 0.88), rgba(8, 16, 30, 0.68));
            border: 1px solid rgba(255, 255, 255, 0.12);
            z-index: 100;
            backdrop-filter: blur(14px);
            box-shadow: 0 18px 40px rgba(0,0,0,0.35), 0 0 28px rgba(0,255,204,0.08);
        }
        #camera-preview::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 22px;
            padding: 1px;
            background: linear-gradient(140deg, rgba(0,255,204,0.38), rgba(255,0,102,0.18), rgba(255,255,255,0.08));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        .preview-title {
            margin-bottom: 8px;
            color: #9fffee;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }
        #input_video {
            width: 100%;
            height: calc(100% - 24px);
            border-radius: 14px;
            object-fit: cover;
            transform: scaleX(-1);
            background: rgba(255,255,255,0.04);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
        }
        
        /* 加载与错误提示面板 */
        #loader {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 18px; pointer-events: auto; text-align: center;
            background: linear-gradient(180deg, rgba(4, 12, 20, 0.92), rgba(7, 12, 24, 0.78));
            padding: 30px 34px; border-radius: 22px;
            border: 1px solid rgba(0, 255, 204, 0.25); backdrop-filter: blur(16px);
            max-width: 450px; z-index: 200;
            box-shadow: 0 16px 50px rgba(0,0,0,0.45), 0 0 30px rgba(0,255,204,0.12);
        }
        #loader::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 22px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(0,255,204,0.45), rgba(255,0,102,0.18), rgba(255,255,255,0.08));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* 全屏按钮 */
        #fs-btn {
            position: absolute; bottom: 220px; right: 20px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(0, 255, 204, 0.08));
            border: 1px solid rgba(255, 255, 255, 0.22);
            color: white; padding: 11px 20px; cursor: pointer; border-radius: 999px;
            backdrop-filter: blur(10px); transition: 0.3s; z-index: 100;
            box-shadow: 0 10px 24px rgba(0,0,0,0.25), inset 0 0 0 1px rgba(255,255,255,0.04);
            font-weight: 600;
            letter-spacing: 0.4px;
        }
        #fs-btn:hover {
            background: linear-gradient(135deg, rgba(255,255,255,0.22), rgba(0,255,204,0.18));
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(0,255,204,0.18);
        }

        /* 手势与状态指示 */
        #status {
            position: absolute; top: 20px; left: 20px;
            color: #aafdf0; font-size: 14px;
            background: linear-gradient(135deg, rgba(3,14,24,0.84), rgba(8,16,30,0.6));
            padding: 12px 18px; border-radius: 18px; border: 1px solid rgba(0,255,204,0.45);
            opacity: 0; transition: opacity 0.5s; z-index: 100;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 18px rgba(0, 255, 204, 0.18), inset 0 0 14px rgba(0,255,204,0.06);
            min-width: 220px;
        }

        #guide-panel {
            position: absolute;
            left: 20px;
            bottom: 20px;
            max-width: calc(100vw - 340px);
            padding: 12px 16px;
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(5, 12, 22, 0.88), rgba(8, 16, 30, 0.68));
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #eefbff;
            z-index: 100;
            backdrop-filter: blur(14px);
            box-shadow: 0 18px 40px rgba(0,0,0,0.35), 0 0 28px rgba(0,255,204,0.08);
            overflow: hidden;
        }
        #guide-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 999px;
            padding: 1px;
            background: linear-gradient(140deg, rgba(0,255,204,0.38), rgba(255,0,102,0.18), rgba(255,255,255,0.08));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        .guide-inline {
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(239, 248, 255, 0.88);
            font-size: 12px;
            line-height: 1.5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .guide-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.35), rgba(0,255,204,0.15));
            box-shadow: 0 0 14px rgba(0,255,204,0.24);
            font-size: 14px;
        }
        .guide-key {
            color: #9fffee;
            font-size: 12px;
            font-weight: 600;
        }
        
        /* 深度定制 lil-gui 的赛博全息玻璃质感 */
        .lil-gui { 
            --background-color: rgba(15, 20, 30, 0.55) !important;
            --text-color: #00ffcc !important;
            --title-background-color: rgba(0, 255, 204, 0.15) !important;
            --widget-color: rgba(255, 255, 255, 0.08) !important;
            --hover-color: rgba(0, 255, 204, 0.3) !important;
            --focus-color: rgba(0, 255, 204, 0.5) !important;
            border-radius: 16px !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            border: 1px solid rgba(0, 255, 204, 0.25) !important;
            box-shadow: 0 8px 32px rgba(0, 255, 204, 0.15), inset 0 0 10px rgba(0,255,204,0.05) !important;
            right: 20px !important;
            top: 20px !important;
            padding-bottom: 8px !important;
            font-family: 'Segoe UI', system-ui, sans-serif !important;
            transition: all 0.3s ease !important;
        }
        .lil-gui:hover {
            border-color: rgba(0, 255, 204, 0.5) !important;
            box-shadow: 0 8px 32px rgba(0, 255, 204, 0.25), inset 0 0 15px rgba(0,255,204,0.1) !important;
        }
        .lil-gui .title {
            border-radius: 15px 15px 0 0 !important;
            font-weight: 600 !important;
            letter-spacing: 1px !important;
            text-shadow: 0 0 8px rgba(0,255,204,0.6) !important;
            padding: 10px !important;
        }
        .lil-gui .slider {
            border-radius: 10px !important;
        }
        .lil-gui.root > .children {
            padding: 5px 10px !important;
        }
    </style>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/jsm/libs/lil-gui.module.min.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>
<body>

    <div id="loader">
        <div id="loader-text">正在初始化摄像头与AI模型...<br><span style="font-size:14px; opacity:0.7">请允许摄像头权限</span></div>
    </div>
    <div id="status">系统就绪</div>
    <div id="guide-panel">
        <div class="guide-inline">
            <span class="guide-badge">AI</span>
            <span><span class="guide-key">玩法</span>：✌️ 双心 | 🫰 穿心箭 | 👌 重置 | 🖐️ 张合手指控制扩散 | 无摄像头时可用鼠标/触控</span>
        </div>
    </div>
    <div id="camera-preview">
        <div class="preview-title">玩家画面</div>
        <video id="input_video" width="640" height="480" autoplay playsinline></video>
    </div>
    <button id="fs-btn">⛶ 全屏模式</button>

    <script type="module">
        import { GUI } from 'https://unpkg.com/three@0.160.0/examples/jsm/libs/lil-gui.module.min.js';

        // --- STREAMING_CHUNK:Initializing global variables ---
        let scene, camera, renderer, particles, geometry;
        let targetPositions = []; 
        let particleCount = 15000; // 将 const 改为 let 以支持动态修改
        let positions = new Float32Array(particleCount * 3); // 将 const 改为 let
        let particleGroups = new Uint8Array(particleCount); // 将 const 改为 let
        let cameraActive = false;
        
        // 爱心专属手势触发状态
        let secondHeartTriggered = false;
        let secondHeartRevealY = -20.0;
        let arrowTriggered = false;
        let arrowRevealX = -20.0;
        
        // 交互状态
        const state = {
            shape: 'heart',
            color: '#ff0055',
            particleSize: 0.08,
            particleCount: 15000, // 新增: 粒子数量控制器状态
            handOpenness: 0, 
            smoothing: 0.1,  
            heartDistance: 3.2 
        };

        // --- STREAMING_CHUNK:Setting up Three.js scene, camera, and renderer ---
        function initThree() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.02);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 20;
            camera.position.y = 2;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.PointsMaterial({
                color: state.color,
                size: state.particleSize,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            generateShape('heart');
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            document.getElementById('fs-btn').addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            });

            // 鼠标/触控交互fallback监听
            window.addEventListener('mousemove', (e) => {
                if (!cameraActive) {
                    const centerY = window.innerHeight / 2;
                    const dy = Math.abs(e.clientY - centerY);
                    let openness = dy / centerY;
                    state.handOpenness = Math.min(1, Math.max(0, openness));
                    document.getElementById('status').innerText = `鼠标控制模式: ${(state.handOpenness * 100).toFixed(0)}%`;
                    document.getElementById('status').style.opacity = '1';
                }
            });

            window.addEventListener('touchmove', (e) => {
                if (!cameraActive && e.touches.length > 0) {
                    const centerY = window.innerHeight / 2;
                    const dy = Math.abs(e.touches[0].clientY - centerY);
                    let openness = dy / centerY;
                    state.handOpenness = Math.min(1, Math.max(0, openness));
                    document.getElementById('status').innerText = `触控控制模式: ${(state.handOpenness * 100).toFixed(0)}%`;
                    document.getElementById('status').style.opacity = '1';
                }
            });
        }

        // --- STREAMING_CHUNK:Implementing mathematical algorithms for shapes ---
        
        // 新增: 动态更新粒子系统缓冲区的函数
        function updateParticleSystem() {
            particleCount = parseInt(state.particleCount);
            positions = new Float32Array(particleCount * 3);
            particleGroups = new Uint8Array(particleCount);
            
            // 重新绑定新的位置缓冲区
            particles.geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            // 基于新数量重新生成形状
            generateShape(state.shape);
        }

        function generateShape(type) {
            targetPositions = [];
            const scale = 5;

            for (let i = 0; i < particleCount; i++) {
                let x, y, z;
                
                if (type === 'heart') {
                    // 划分粒子：80%用于双爱心，20%用于穿心箭
                    const heartPartCount = Math.floor(particleCount * 0.8);
                    
                    if (i < heartPartCount) {
                        const isLeft = i < heartPartCount / 2;
                        const offsetX = isLeft ? -state.heartDistance : state.heartDistance;
                        
                        // 分组: 0为左侧(始终显示), 1为右侧(需手势触发)
                        particleGroups[i] = isLeft ? 0 : 1; 
                        
                        const t = Math.random() * Math.PI * 2;
                        let hx = 16 * Math.pow(Math.sin(t), 3);
                        let hy = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                        let hz = (Math.random() - 0.5) * 10;
                        
                        const r = Math.random();
                        hx *= r * 0.32; hy *= r * 0.32; hz *= r * 0.32;
                        
                        // 侧着的正面平行：左右爱心旋转相同的角度（同向倾斜）
                        const angle = 0.5;
                        const cosA = Math.cos(angle);
                        const sinA = Math.sin(angle);
                        
                        const rotX = hx * cosA + hz * sinA;
                        const rotY = hy;
                        const rotZ = -hx * sinA + hz * cosA;
                        
                        x = rotX + offsetX;
                        y = rotY;
                        z = rotZ;
                    } else {
                        // 分组: 2为穿心箭(需手势触发)
                        particleGroups[i] = 2; 
                        
                        const arrowIndex = i - heartPartCount;
                        const arrowPartCount = particleCount - heartPartCount;
                        const ratio = arrowIndex / arrowPartCount;
                        
                        if (ratio < 0.65) {
                            // 箭杆 (Shaft) - 从左下穿向右上
                            const t = ratio / 0.65;
                            const startX = -13, startY = -7, startZ = -3;
                            const endX = 13, endY = 7, endZ = 3;
                            
                            x = startX + t * (endX - startX) + (Math.random() - 0.5) * 0.8;
                            y = startY + t * (endY - startY) + (Math.random() - 0.5) * 0.8;
                            z = startZ + t * (endZ - startZ) + (Math.random() - 0.5) * 0.8;
                        } else if (ratio < 0.9) {
                            // 箭头 (Arrowhead) - 锥形尖端
                            const coneProgress = (ratio - 0.65) / 0.25;
                            const tipX = 15, tipY = 8.2, tipZ = 3.5;
                            const baseX = 11, baseY = 6, baseZ = 2.5;
                            
                            const currentX = baseX + coneProgress * (tipX - baseX);
                            const currentY = baseY + coneProgress * (tipY - baseY);
                            const currentZ = baseZ + coneProgress * (tipZ - baseZ);
                            
                            const radius = (1 - coneProgress) * 3.0;
                            const theta = Math.random() * Math.PI * 2;
                            x = currentX + radius * Math.cos(theta) * 0.8;
                            y = currentY + radius * Math.sin(theta) * 0.8;
                            z = currentZ + radius * Math.sin(theta) * 0.8;
                        } else {
                            // 箭羽 (Fletching) - 尾部羽翼
                            const tailProgress = (ratio - 0.9) / 0.1;
                            const tailX = -13, tailY = -7, tailZ = -3;
                            const featherSpread = tailProgress * 4.5;
                            const wingAngle = Math.floor(Math.random() * 3) * ((Math.PI * 2) / 3);
                            
                            x = tailX - tailProgress * 4.5 + (Math.random() - 0.5) * 0.8;
                            y = tailY + Math.sin(wingAngle) * featherSpread + (Math.random() - 0.5) * 0.8;
                            z = tailZ + Math.cos(wingAngle) * featherSpread + (Math.random() - 0.5) * 0.8;
                        }
                    }
                    
                } else if (type === 'flower') {
                    particleGroups[i] = 0;
                    const u = Math.random() * Math.PI * 4;
                    const v = Math.random() * Math.PI;
                    const r = 3 * Math.cos(3 * u);
                    x = r * Math.sin(v) * Math.cos(u) * scale;
                    y = r * Math.sin(v) * Math.sin(u) * scale;
                    z = r * Math.cos(v) * scale;

                } else if (type === 'star') {
                    particleGroups[i] = 0;
                    const isRing = Math.random() > 0.6;
                    if (isRing) {
                        const theta = Math.random() * Math.PI * 2;
                        const r = 6 + Math.random() * 2;
                        x = r * Math.cos(theta);
                        z = r * Math.sin(theta);
                        y = (Math.random() - 0.5) * 0.5;
                    } else {
                        const theta = Math.random() * Math.PI * 2;
                        const phi = Math.acos(2 * Math.random() - 1);
                        const r = 3.5;
                        x = r * Math.sin(phi) * Math.cos(theta);
                        y = r * Math.sin(phi) * Math.sin(theta);
                        z = r * Math.cos(phi);
                    }

                } else if (type === 'buddha') {
                    particleGroups[i] = 0;
                    const r = Math.random();
                    if (r < 0.3) {
                        const theta = Math.random() * Math.PI * 2;
                        const phi = Math.acos(2 * Math.random() - 1);
                        x = 1.5 * Math.sin(phi) * Math.cos(theta);
                        y = 1.5 * Math.sin(phi) * Math.sin(theta) + 3.5;
                        z = 1.5 * Math.cos(phi);
                    } else if (r < 0.7) {
                        const theta = Math.random() * Math.PI * 2;
                        const phi = Math.acos(2 * Math.random() - 1);
                        x = 2.5 * Math.sin(phi) * Math.cos(theta);
                        y = 2.5 * Math.sin(phi) * Math.sin(theta);
                        z = 2.5 * Math.cos(phi);
                    } else {
                        const theta = Math.random() * Math.PI * 2;
                        const rad = 4 * Math.sqrt(Math.random());
                        x = rad * Math.cos(theta);
                        z = rad * Math.sin(theta);
                        y = (Math.random() - 0.5) * 2 - 2; 
                    }

                } else if (type === 'fireworks') {
                    particleGroups[i] = 0;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    const r = Math.random() * 10;
                    x = r * Math.sin(phi) * Math.cos(theta);
                    y = r * Math.sin(phi) * Math.sin(theta);
                    z = r * Math.cos(phi);
                }

                targetPositions.push(x, y, z);
            }
        }

        // --- STREAMING_CHUNK:Setting up Lil-GUI control panel ---
        function initGUI() {
            const gui = new GUI({ title: '✨ 幻境控制枢纽' });
            
            gui.add(state, 'shape', {
                '💕 双爱心': 'heart',
                '🌸 花朵': 'flower',
                '🪐 星球': 'star',
                '🧘 禅意': 'buddha',
                '🎆 烟花': 'fireworks'
            }).name('✨ 模型选择').onChange((val) => {
                // 切换模型时重置隐藏状态
                secondHeartTriggered = false;
                secondHeartRevealY = -20.0;
                arrowTriggered = false;
                arrowRevealX = -20.0;
                
                generateShape(val);
                if(val === 'heart') distanceController.show(); else distanceController.hide();
            });

            // 新增：动态粒子数量选项
            gui.add(state, 'particleCount', {
                '🟢 流畅体验 (5,000)': 5000,
                '🔵 均衡标准 (15,000)': 15000,
                '🟣 繁星密集 (30,000)': 30000,
                '🔴 视觉盛宴 (50,000)': 50000,
                '🔥 燃烧显卡 (100,000)': 100000
            }).name('🌟 粒子数量').onChange(() => {
                updateParticleSystem();
            });

            const distanceController = gui.add(state, 'heartDistance', 1.0, 10.0).name('📏 双心间距').onChange((val) => {
                if (state.shape === 'heart') generateShape('heart');
            });

            gui.addColor(state, 'color').name('🎨 粒子颜色').onChange((val) => {
                particles.material.color.set(val);
            });

            gui.add(state, 'particleSize', 0.01, 0.5).name('🔍 粒子大小').onChange((val) => {
                particles.material.size = val;
            });

            gui.add(state, 'smoothing', 0.01, 0.5).name('⚡ 响应速度');
        }

        // --- STREAMING_CHUNK:Creating animation and rendering loop ---
        function animate() {
            requestAnimationFrame(animate);

            // 控制手势触发的逐步显现与缓慢消失动画进度
            if (secondHeartTriggered) {
                if (secondHeartRevealY < 15.0) secondHeartRevealY += 0.08; // 右心从下往上缓慢浮现的速度
            } else {
                if (secondHeartRevealY > -20.0) secondHeartRevealY -= 0.15; // 右心缓慢消失（从上往下退去）
            }
            
            if (arrowTriggered) {
                if (arrowRevealX < 20.0) arrowRevealX += 0.25; // 箭头从左往右穿透的速度
            } else {
                if (arrowRevealX > -20.0) arrowRevealX -= 0.35; // 箭头缓慢拔出/消失（从右往左消散）
            }

            const positionsArray = particles.geometry.attributes.position.array;
            const explodeFactor = state.handOpenness * 8.0; 
            const noiseScale = state.handOpenness * 0.5;

            for (let i = 0; i < particleCount; i++) {
                const ix = i * 3;
                const iy = i * 3 + 1;
                const iz = i * 3 + 2;

                let tx = targetPositions[ix];
                let ty = targetPositions[iy];
                let tz = targetPositions[iz];
                
                const group = particleGroups[i];
                let isVisible = true;

                // 判断右心和箭头的可见性 (移除布尔值直接隐藏，完全交给阈值控制)
                if (state.shape === 'heart') {
                    if (group === 1) { // 右侧心
                        if (ty > secondHeartRevealY) isVisible = false;
                    } else if (group === 2) { // 穿心箭
                        if (tx > arrowRevealX) isVisible = false;
                    }
                }

                // 如果不可见，将其挪到屏幕外的无效区域隐藏
                if (!isVisible) {
                    positionsArray[ix] = 0;
                    positionsArray[iy] = -999; // 藏在地下
                    positionsArray[iz] = 0;
                    continue; // 跳过此粒子的位置运算
                }

                // 如果粒子刚从不可见状态(-999)被唤醒，赋予它一个贴近目标的位置，产生飞入效果
                if (positionsArray[iy] < -900) {
                    positionsArray[ix] = tx;
                    if (group === 1) positionsArray[iy] = ty - 2.5; // 第二颗心从下方冒出
                    else if (group === 2) positionsArray[ix] = tx - 3.0; // 箭头从左侧刺入
                    else positionsArray[iy] = ty;
                    positionsArray[iz] = tz;
                }

                if (explodeFactor > 0.1) {
                    tx += tx * explodeFactor * 0.5;
                    ty += ty * explodeFactor * 0.5;
                    tz += tz * explodeFactor * 0.5;
                    
                    tx += (Math.random() - 0.5) * noiseScale;
                    ty += (Math.random() - 0.5) * noiseScale;
                    tz += (Math.random() - 0.5) * noiseScale;
                }

                positionsArray[ix] += (tx - positionsArray[ix]) * state.smoothing;
                positionsArray[iy] += (ty - positionsArray[iy]) * state.smoothing;
                positionsArray[iz] += (tz - positionsArray[iz]) * state.smoothing;
            }

            particles.rotation.y += 0.002;
            particles.rotation.z += 0.001 * (1 + state.handOpenness * 5);

            particles.geometry.attributes.position.needsUpdate = true;
            renderer.render(scene, camera);
        }

        // --- STREAMING_CHUNK:Configuring MediaPipe Hands and robust camera error handling ---
        function initMediaPipe() {
            const videoElement = document.getElementById('input_video');
            
            const hands = new Hands({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }});

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onResults);

            const cameraUtils = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({image: videoElement});
                },
                width: 640,
                height: 480
            });
            
            cameraUtils.start()
                .then(() => {
                    cameraActive = true;
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('status').style.opacity = '1';
                })
                .catch(err => {
                    console.warn("摄像头启动失败（可能被占用），已自动切换为鼠标/触控模式:", err);
                    cameraActive = false;
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('status').style.opacity = '1';
                    document.getElementById('status').innerText = '💡 摄像头被占用，已自动切换为鼠标/触控交互模式';
                });
        }

        function onResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const thumbTip = landmarks[4];
                const indexTip = landmarks[8];

                const distance = Math.sqrt(
                    Math.pow(thumbTip.x - indexTip.x, 2) +
                    Math.pow(thumbTip.y - indexTip.y, 2) +
                    Math.pow(thumbTip.z - indexTip.z, 2)
                );

                let openness = (distance - 0.03) / (0.15 - 0.03);
                openness = Math.max(0, Math.min(1, openness));

                state.handOpenness = openness;
                
                // --- 爱心模式专属手势识别 ---
                if (state.shape === 'heart') {
                    // 1. 判断各手指伸直状态
                    const isUp = (tip, pip) => landmarks[tip].y < landmarks[pip].y;
                    const idxUp = isUp(8, 6);
                    const midUp = isUp(12, 10);
                    const rngUp = isUp(16, 14);
                    const pnkUp = isUp(20, 18);
                    
                    // 触发第二颗爱心: 剪刀手 (食指中指伸直，无名指小指弯曲)
                    if (!secondHeartTriggered && idxUp && midUp && !rngUp && !pnkUp) {
                        secondHeartTriggered = true;
                    }
                    
                    // 触发一箭穿心: 手指爱心 (食指拇指近，且其他三指不能全伸直，防止与OK冲突)
                    if (secondHeartTriggered && !arrowTriggered && distance < 0.05 && (!midUp || !rngUp || !pnkUp)) {
                        arrowTriggered = true;
                    }

                    // 恢复单颗爱心: OK手势 (食指拇指近，且中指、无名指、小指都伸直)
                    if ((secondHeartTriggered || arrowTriggered) && distance < 0.05 && midUp && rngUp && pnkUp) {
                        secondHeartTriggered = false;
                        arrowTriggered = false;
                        // 注意：这里删除了坐标瞬间重置的代码，让 animate() 去处理缓慢消失的过渡效果
                    }
                    
                    // UI状态提示更新
                    if (!secondHeartTriggered && secondHeartRevealY <= -19.0) {
                        document.getElementById('status').innerText = `比出剪刀手(✌️)召唤第二颗心...`;
                    } else if (secondHeartTriggered && !arrowTriggered && arrowRevealX <= -19.0) {
                        document.getElementById('status').innerText = `大拇指与食指交叉比心(🫰)，触发一箭穿心！`;
                    } else {
                        document.getElementById('status').innerText = `比出OK手势(👌)恢复单心 | 扩散控制: ${(openness * 100).toFixed(0)}%`;
                    }
                } else {
                    document.getElementById('status').innerText = `手势控制中: ${(openness * 100).toFixed(0)}%`;
                }

            } else {
                state.handOpenness = state.handOpenness * 0.9;
                document.getElementById('status').innerText = `等待手势中...`;
            }
        }

        // --- STREAMING_CHUNK:Starting the application ---
        initThree();
        initGUI();
        animate();
        setTimeout(initMediaPipe, 800);

    </script>
